[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "emos-backend"
version = "0.1.0"
description = "EMOS — Engineering Memory Operating System backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.5",
    "uvicorn[standard]==0.32.1",
    "pydantic==2.10.3",
    "pydantic-settings==2.6.1",
    "sqlalchemy==2.0.36",
    "alembic==1.14.0",
    "pyyaml==6.0.2",
    "python-dotenv==1.0.1",
    "anthropic==0.40.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.4", "pytest-asyncio==0.24.0", "httpx==0.28.1", "pytest-cov==6.0.0"]
ml  = ["sentence-transformers==3.3.1", "faiss-cpu==1.9.0"]
intel = ["tree-sitter>=0.25", "tree-sitter-python>=0.25", "tree-sitter-javascript>=0.25"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]
